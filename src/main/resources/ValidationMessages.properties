# 特定のフィールドに対するメッセージ（Post）
NotBlank.post.title=タイトルは必須入力です
NotBlank.post.content=内容は必須入力です

# 特定のフィールドに対するメッセージ（User）
NotNull.user.username=ユーザー名を入力してください
Size.user.username=ユーザー名は4文字以上10文字以内で入力してください
Pattern.user.username=ユーザー名は半角英字と半角数字を両方含めて入力してください

NotNull.user.password=パスワードを入力してください
Size.user.password=パスワードは8文字以上20文字以内で入力してください
Pattern.user.password=パスワードは半角英字と半角数字を両方含めて入力してください

# 全ての @NotBlank に対するデフォルトメッセージ
NotBlank=項目を入力してください

#追記：特定のフィールドに対するメッセージ（form）
NotBlank.form.name = お名前を入力してください
Size.form.name = お名前は50文字以内で入力してください

NotBlank.form.email = メールアドレスを入力してください
Email.form.email =  正しいメールアドレスの形式で入力してください

NotBlank.form.subject = 件名を入力してください
Size.form.subject = 件名は100文字以内で入力してください

NotBlank.form.message = お問い合わせ内容を入力してください
Size.form.message = お問い合わせ内容は1000文字以内で入力してください。




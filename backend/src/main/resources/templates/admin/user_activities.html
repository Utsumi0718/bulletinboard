<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title layout:fragment="title">管理画面 - ユーザー活動履歴</title>
</head>

  <div layout:fragment="content" class="container mt-4">

    <!-- ヘッダー情報 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>
        <span th:text="${targetUser.username}">ユーザー名</span>さんの活動履歴
        <span class="badge bg-secondary" th:text="${targetUser.role}">ROLE_USER</span>

      </h2>
      <a th:href="@{/admin/users}" class="btn btn-outline-secondary">ユーザー管理一覧へ戻る</a>
    </div>

   <!-- 投稿一覧セクション -->
   <div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">投稿一覧（<span th:text="${posts.size()}">0</span>件）</h4>
    </div>

    <div class="card-body">
      <div th:if="${#lists.isEmpty(posts)}">投稿はありません</div>

      <table th:unless="${#lists.isEmpty(posts)}" border="1" style="width: 100%; border-collapse: collapse;">
        <thead style="background-color: #f2f2f2;">
          <tr>
            <th>ID</th>
            <th>タイトル</th>
            <th>内容</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td>
              <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}" target="_blank">投稿タイトル</a>
            </td>
            <td th:text="${post.content}">投稿本文..</td>
            <td>
              <!-- 管理者による削除フォーム -->
              <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" onclick="return confirm('管理権限でこの投稿を削除しますか？');">
                  削除
               </button>
              </form>
            </td>
          </tr>
      </tbody>
      </table>
    </div>

   </div>

   <div>

   </div>

   <!-- コメント一覧セクション -->
    <div class="card mb-4">
      <div class="card-header bg-info text-white">
            <h4 class="mb-0">コメント一覧 (<span th:text="${comments.size()}">0</span>件)</h4>
        </div>

        <table th:unless="${#lists.isEmpty(comments)}" border="1" style="width: 100%; border-collapse: collapse;">
                <thead style="background-color: #f2f2f2;">
                    <tr>
                        <th>ID</th>
                        <th>対象投稿ID</th>
                        <th>コメント内容</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="comment : ${comments}">
                        <td th:text="${comment.id}">1</td>
                        <td>
                            <a th:if="${comment.post != null}" th:href="@{/posts/{id}(id=${comment.post.id})}" th:text="${comment.post.id}" target="_blank">1</a>
                        </td>
                        <td th:text="${comment.content}">コメント内容...</td>
                        <td>
                            <!-- 管理者によるコメント削除フォーム -->
                            <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post" style="display: inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="postId" th:if="${comment.post != null}" th:value="${comment.post.id}">
                                <button type="submit" onclick="return confirm('管理権限でこのコメントを削除しますか？');">
                                    削除
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
    </div>

  </div>

</html>

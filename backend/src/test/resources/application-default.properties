# =====================================================================
# 1. データベース接続の基本設定（H2データベースをMySQLっぽく動かす）
# =====================================================================

# 【接続先URL】パソコンのメモリ上だけに「testdb」という名前のテスト用DBを作る
# ＆ 本番で使うMySQLのルール（MODE=MySQL）や小文字の扱い（DATABASE_TO_LOWER=TRUE）を合わせる
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE

# 【ドライバー設定】JavaからH2データベースを動かすための専用プログラムを指定する
spring.datasource.driver-class-name=org.h2.Driver

# 【ログイン設定】データベースに接続するときのユーザー名（sa = 管理者）とパスワード（今回はなし）
spring.datasource.username=sa
spring.datasource.password=


# =====================================================================
# 2. テーブルの自動作成・破棄設定
# =====================================================================

# 【自動生成ルール】テストが「始まる時にテーブルを新規作成し、終わる時にすべて綺麗に消去する」設定
spring.jpa.hibernate.ddl-auto=create-drop


# =====================================================================
# 3. 初期データの流し込みタイミング調整設定
# =====================================================================

# 【実行順の制御】Javaの設計図（Entity）を元にテーブルが完全に作り終わるのを待ってから、
# 初期データを入れるSQLスクリプトを実行するように「タイミングを後ろにずらす（defer）」設定
spring.jpa.defer-datasource-initialization=true
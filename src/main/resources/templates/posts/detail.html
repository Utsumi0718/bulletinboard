<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">投稿詳細</title>
</head>
<body>
<div layout:fragment="content">
 <h1 th:text="${post.title}">タイトル</h1>

<div class="card mb-4">
 <div class="card-body">
  <!-- 改行を維持するために th:utext または白文字設定を使用 -->
  <p class="card-text" th:text="${post.content}" style="white-space: pre-wrap;">投稿内容</p>
 </div>
</div>

 <div class="d-flex gap-2">
            <a th:href="@{/posts}" class="btn btn-secondary">一覧に戻る</a>
            <!-- 編集と削除は後ほど実装します -->
            <!-- 編集ボタンを実装 -->
           <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary">編集</a>
           <button class="btn btn-danger">削除</button>
    </div>
</div>
</body>
</html>

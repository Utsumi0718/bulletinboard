<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title layout:fragment="title">管理画面 - ユーザー管理</title>
</head>

<body>
  <div layout:fragment="content">

    <!-- 追記；お問い合わせ一覧ページ遷移 -->
     <!-- お問い合わせ画面への遷移ボタン -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>ユーザー管理一覧</h3>
    <a th:href="@{/admin/contacts}" class="btn btn-primary">
        お問い合わせ一覧を見る
    </a>
</div>

    <!-- ユーザー一覧を表示 -->
    <table border="1" style="width: 100%; border-collapse: collapse;">
      <thead style="background-color: #f2f2f2;">
        <tr>
          <th>ID</th>
          <th>ユーザー名</th>
          <th>権限</th>
          <th>投稿数</th>
          <th>コメント数</th>
          <th>ログイン失敗回数</th>
          <th>アカウント状況</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">user01</td>
            <td th:text="${u.role}">ROLE_USER</td>

            <!-- 投稿数：0より大きければリンク表示 -->
            <td>
              <a th:if="${u.posts.size() > 0}"
                 th:href="@{/admin/users/{id}/activities(id=${u.id})}"
                 th:text="${u.posts.size()}">1</a>
              <span th:if="${u.posts.size() == 0}">0</span>
            </td>

           <!-- コメント数：0より大きければリンク表示 -->
         <td>
           <a th:if="${u.comments.size() > 0}"
              th:href="@{/admin/users/{id}/activities(id=${u.id})}"
              th:text="${u.comments.size()}">1</a>
          <span th:if="${u.comments.size() == 0}">0</span>
        </td>

            <td th:text="${u.failedAttempt}">0</td>
            <td>
                <span th:if="${u.accountNonLocked}" style="color: blue; font-weight: bold">通常</span>
                <span th:unless="${u.accountNonLocked}" style="color: red; font-weight: bold">凍結中</span>
            </td>
            <td>
                <!-- 追記：自分自身(管理人)の場合は操作不可にする -->
                 <span th:if="${u.username == #authentication.name or u.role == 'ROLE_ADMIN'}">操作不可</span>
                <!-- 一般ユーザー（ROLE＿USER）の項目だけ切り替えボタンを表示 -->
                 <form th:unless="${u.username == #authentication.name or u.role == 'ROLE_ADMIN'}"
                      th:action="@{/admin/users/{id}/toggle-lock(id=${u.id})}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            th:text="${u.accountNonLocked ? '凍結する' : '解除する'}"
                            th:onclick="return confirm('本当にアカウント状態を変更しますか？');">
                        切り替え
                    </button>
                </form>
            </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>

</html>

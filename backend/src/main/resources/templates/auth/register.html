<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
                xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
                layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">新規ユーザ登録</title>
</head>
<div layout:fragment="content">
  <h1>ユーザー登録</h1>
<!--  th:actionを使うことで、Spring Securityに必要なCSRFトークンが自動挿入されます -->
  <form th:action="@{/register}" th:object="${registerForm}" method="post">

    <div>
    <label for="username">ユーザー名</label>
    <input type="text"
           th:field="*{username}"
           required
           id="username">

    <div th:if="${#fields.hasErrors('username')}"
         th:errors="*{username}"
         style="color: red;">
    </div>
</div>

    <!-- emailの入力欄を追記 -->
    <div>
    <label for="email">メールアドレス</label>
    <input type="email"
           th:field="*{email}"
           required
           id="email">

    <div th:if="${#fields.hasErrors('email')}"
         th:errors="*{email}"
         style="color: red;">
    </div>
</div>

    <div>
        <label for="password">パスワード</label>
        <input type="password" th:field="*{password}" required>
         <!-- バリテーションエラーメッセージを追加：パスワード-->
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></div>
    </div>
    <button type="submit">登録</button>
  </form>
  <a th:href="@{/login}">ログインはこちら</a>
</div>
</html>

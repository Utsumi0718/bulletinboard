# Spring Bootのアプリケーション名
spring.application.name=bulletinboard

#MySQLの接続情報
spring.datasource.url=jdbc:mysql://localhost:3306/bulletinboard?useSSL=false

#ユーザー名とパスワード
spring.datasource.username=root
spring.datasource.password=password

#ドライバクラス（（Java）とデータベースを“つなぐための専用）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#「JPA・Hibernate設定」＝Spring Boot がデータベースとやり取りするための“振る舞い”を決める設定の総称。
# MySQL 8用のダイアレクト（方言）設定
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# エンティティに合わせてテーブル構造を自動更新
spring.jpa.hibernate.ddl-auto=update
# 実行されるSQLをコンソールに表示
spring.jpa.show-sql=true
# 出力されるSQLを読みやすく整形
spring.jpa.properties.hibernate.format_sql=true

#開発用便利設定

# Spring Webの詳細ログを出力
logging.level.org.springframework.web=debug
# SQLのパラメータ（?の中身）をログに表示
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
# DevToolsによるオートリロード（自動再起動）を有効化
spring.devtools.restart.enabled=true
# Thymeleafのキャッシュを無効化（HTMLの修正を即時反映）
spring.thymeleaf.cache=false
# Thymeleafの詳細ログを出力
logging.level.org.thymeleaf=debug

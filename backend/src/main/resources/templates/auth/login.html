<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">ログイン画面</title>
</head>

<div layout:fragment="content">
    <h1>ログイン</h1>

    <div th:if="${param.register_success}">
        ユーザー登録が完了しました。ログインしてください。
    </div>

    <div th:if="${param.reset_success}" style="color: green;">
        パスワードの再設定が完了しました。新しいパスワードでログインしてください。
    </div>

    <!-- メールアドレスまたはパスワードが正しくない場合 -->
    <div th:if="${param.error != null and param.error[0] == 'wrong'}"
         style="color: red;">
        メールアドレスまたはパスワードが正しくありません
    </div>

    <!-- ログイン失敗回数によるアカウントロック -->
    <div th:if="${param.error != null and param.error[0] == 'locked'}"
         style="color: red;">
        ログイン失敗回数が上限に達したため、アカウントがロックされました。<br>
        ログインできない場合は
        <a th:href="@{/reset-password}">パスワード再設定</a>
        を行ってください。
    </div>

    <form th:action="@{/login}" method="post">

        <div>
            <label for="email">メールアドレス: </label>
            <input type="email" name="email" id="email">

            <!-- メールアドレスが未入力の場合 -->
            <div th:if="${param.error != null
                        and (param.error[0] == 'email_empty'
                        or param.error[0] == 'both_empty')}"
                 style="color: red;">
                <p th:text="#{NotNull.user.email}"></p>
            </div>
        </div>

        <div>
            <label for="password">パスワード: </label>
            <input type="password" name="password" id="password">

            <!-- パスワードが未入力の場合 -->
            <div th:if="${param.error != null
                        and (param.error[0] == 'password_empty'
                        or param.error[0] == 'both_empty')}"
                 style="color: red;">
                <p th:text="#{NotNull.user.password}"></p>
            </div>
        </div>

        <button type="submit">ログイン</button>
    </form>

    <a th:href="@{/register}">新規登録はこちら</a>

    <br>

    <a th:href="@{/reset-password}">パスワードをお忘れの方はこちら</a>
</div>

</html>

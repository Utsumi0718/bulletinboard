<!DOCTYPE html>
<!-- HTML5のドキュメントタイプ宣言 -->

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<!-- layout:decorate="~{layout/layout}": ベースとなる共通レイアウト（templates/layout/layout.html）を適用宣言 -->

<head>
  <title layout:fragment="title">新規投稿</title>
  <!-- layout:fragment="title": 親レイアウトの title フラグメント領域に「新規投稿」という文字列を注入 -->
</head>

<body>

 <div layout:fragment="content">
 <!-- layout:fragment="content": 親レイアウトの content フラグメント領域に以下のHTMLを挿入するグループの開始 -->

  <h1 class="title mb-3">新規投稿</h1>
  <!-- 画面見出し（下に余白を設定） -->

  <!-- 投稿フォーム  -->
  <form th:action="@{/posts}" th:object="${post}" method="post">
  <!-- th:action: 送信先URLを/postsに設定 / th:object: Controllerから渡されたpostオブジェクトをフォーム全体にバインド -->

   <div class="mb-3">
    <label for="title" class="form-label">タイトル</label>
    <!-- 入力項目のラベル表現 -->

    <!-- th:field を使うことでモデルのプロパティと紐付けます -->
    <input type="text" th:field="*{title}" class="form-control" id="title" placeholder="タイトルを入力してください" required>
    <!-- th:field="*{title}": postオブジェクトのtitleプロパティと入力欄を双方向バインド（name, value, idを自動設定） -->
   </div>

   <div class="mb-3">
    <label for="content" class="form-label">内容</label>
    <!-- 入力項目のラベル表現 -->

    <textarea th:field="*{content}" class="form-control" id="content" rows="5" placeholder="内容を入力してください" required></textarea>
    <!-- th:field="*{content}": postオブジェクトのcontentプロパティとテキストエリアを双方向バインド -->
   </div>

   <div class="d-flex gap-2">
    <!-- ボタンを横並びにして間隔をあけるレイアウト -->

    <button type="submit" class="btn btn-primary">投稿</button>
    <!-- フォームデータを送信するボタン -->

    <a th:href="@{/posts}" class="btn btn-secondary">キャンセル</a>
    <!-- th:href="@{/posts}": キャンセル時に投稿一覧画面（/posts）へ戻るリンクURLを動的生成 -->
   </div>
  </form>

 </div>
 <!-- layout:fragment="content" の終了タグ（※元のコードから位置を正しく修正してレイアウトに組み込まれる範囲を保持） -->

</body>

</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title layout:fragment="title">管理画面 - ユーザー管理</title>
</head>

<body>
  <div layout:fragment="content">

    <!-- ユーザー一覧を表示 -->
    <table border="1" style="width: 100%; border-collapse: collapse;">
      <thead style="background-color: #f2f2f2;">
        <tr>
          <th>ID</th>
          <th>ユーザー名</th>
          <th>権限</th>
          <th>ログイン失敗回数</th>
          <th>アカウント状況</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">user01</td>
            <td th:text="${u.role}">ROLE_USER</td>
            <td th:text="${u.failedAttempt}">0</td>
            <td>
                <span th:if="${u.accountNonLocked}" style="color: blue; font-weight: bold">通常</span>
                <span th:unless="${u.accountNonLocked}" style="color: red; font-weight: bold">凍結中</span>
            </td>
            <td>
                <form th:action="@{/admin/users/{id}/toggle-lock(id=${u.id})}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            th:text="${u.accountNonLocked ? '凍結する' : '解除する'}"
                            th:onclick="return confirm('本当にアカウント状態を変更しますか？');">
                        切り替え
                    </button>
                </form>
            </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>

</html>

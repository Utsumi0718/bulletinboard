<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title layout:fragment="title">
        パスワード再設定
    </title>
</head>

<div layout:fragment="content">

    <h1>パスワード再設定</h1>

    <form th:action="@{/reset-password}"
          th:object="${resetPasswordForm}"
          method="post">

        <!-- パスワード再設定対象のメールアドレス -->
        <div>
            <label for="email">メールアドレス:</label><br>

            <input type="email"
                   id="email"
                   th:field="*{email}" />

            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"
                 style="color: red;">
            </div>
        </div>

        <br>

        <!-- 新しいパスワード -->
        <div>
            <label for="newPassword">
                新しいパスワード:
            </label><br>

            <input type="password"
                   id="newPassword"
                   th:field="*{newPassword}" />

            <div th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"
                 style="color: red;">
            </div>
        </div>

        <br>

        <button type="submit">
            パスワードを変更する
        </button>
    </form>

    <br>

    <a th:href="@{/login}">
        ログイン画面に戻る
    </a>

</div>

</html>

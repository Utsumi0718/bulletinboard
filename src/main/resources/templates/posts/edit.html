<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

  <head>
    <title layout:fragment="title">投稿編集</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="mb-3">投稿編集</h1>

        <!-- actionにIDを含める -->
        <form th:action="@{/posts/{id}(id=${post.id})}" th:object="${post}" method="post">
            <div class="mb-3">
                <label for="title" class="form-title">タイトル</label>
                <input type="text" th:field="*{title}" class="form-control" id="title" required>
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">内容</label>
                <textarea th:field="*{content}" class="form-control" id="content" rows="5" required></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">更新する</button>
                <a th:href="@{/posts}" class="btn btn-secondary">キャンセル</a>
            </div>
        </form>
    </div>
</body>

</html>

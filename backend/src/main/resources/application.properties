# Spring Bootのアプリケーション名
spring.application.name=bulletinboard

#MySQLの接続情報
spring.datasource.url=jdbc:mysql://localhost:3306/bulletinboard?useSSL=false&allowPublicKeyRetrieval=true

#ユーザー名とパスワード
spring.datasource.username=root
spring.datasource.password=password

#ドライバクラス（（Java）とデータベースを“つなぐための専用）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#「JPA・Hibernate設定」＝Spring Boot がデータベースとやり取りするための“振る舞い”を決める設定の総称。
#
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# EntityとDB構造が合っているか確認するだけに変更
spring.jpa.hibernate.ddl-auto=validate
# 実行されるSQLをコンソールへ直接表示しない
spring.jpa.show-sql=false
# SQLの整形出力を無効化
spring.jpa.properties.hibernate.format_sql=false

# =====================================================================
# Flyway
# =====================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Topic画像は最大5,000,000バイト。リクエスト上限にはmultipartの付加情報を含める。
spring.servlet.multipart.max-file-size=5000000B
spring.servlet.multipart.max-request-size=6000000B
spring.servlet.multipart.resolve-lazily=true

# ==========================================
# 開発用便利設定
# ==========================================

# DevToolsによるオートリロードを有効化
spring.devtools.restart.enabled=true


# ==========================================
# ログ設定
# ==========================================

# Webの詳細なDEBUGログを出さない
logging.level.org.springframework.web=INFO

# SQLのログ出力を無効化
logging.level.org.hibernate.SQL=OFF

# SQLのパラメータ値・取得値のログ出力を無効化
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

# 以前のパラメータ出力設定も無効化
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# SQLや入力値を含む可能性があるDB例外の直接出力を抑制
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# 管理操作の安全な運営用ログは出力する
logging.level.com.example.bulletinboard.exception.handler.GlobalExceptionHandler=INFO

# ==========================================
# メール送信設定（Mail Settings）
# ==========================================
# SMTPサーバーのホスト名（Gmailの場合）
spring.mail.host=smtp.gmail.com
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
# SMTPサーバーのポート番号（TLS通信用）
spring.mail.port=587
# 送信元のGoogleアカウントのメールアドレス
spring.mail.username=${MAIL_USERNAME}
# 送信用アプリパスワード（※通常のログインパスワードではありません）
spring.mail.password=${MAIL_PASSWORD}
# SMTP認証を有効化
spring.mail.properties.mail.smtp.auth=true
# STARTTLSによる暗号化通信を有効化
spring.mail.properties.mail.smtp.starttls.enable=true

# メッセージファイルの文字コードをUTF-8に指定
spring.messages.encoding=UTF-8


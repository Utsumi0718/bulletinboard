<!DOCTYPE html>
<!-- HTML5のドキュメントタイプ宣言 -->

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!-- htmlタグ: Thymeleaf標準（th）およびLayout Dialect（layout）の名前空間を定義 -->

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="_csrf" th:content="${_csrf.token}"/>
     <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- CSRF対策のメタタグと非同期通信用のJavaScriptを追加 -->

    <title layout:fragment="title">掲示板アプリ</title>
    <!-- layout:fragment="title": 子画面側の title フラグメントで置き換えられる領域を定義 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--  Bootstrap CSS (CDN):スタイルシートとして外部の Bootstrap 5 を読み込み -->
</head>

<body>
    <!-- 追記：ナビゲーションバーへの管理画面リンク配置 -->
    <header class="header">
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container">
            <a class="navbar-brand" th:href="@{/posts}">掲示板アプリ</a>
            <!--  -->
            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
              <a class="nav-link text-danger fw-bold" th:href="@{/admin/users}">管理画面へ</a>
            </li>
        </div>
    </nav>

    </header>
    <!-- 追記：アラート（フラッシュメッセージ）領域を追加します -->

    <div class="container mt-3">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div  th:if="${errorMessage}"  class="alert alert-success alert-dismissible fade show" role="alert">
          <span th:text="${errorMessage}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

        </div>
    </div>

    <!-- メインコンテンツ：各画面の内容がここに挿入される -->
    <main class="container">
    <!-- メイン表示領域のコンテナ -->

        <div layout:fragment="content"></div>
        <!-- layout:fragment="content": 子画面側の content フラグメントの内容がそのまま挿入される領域 -->
    </main>

    <!-- フッター -->
    <footer class="bg-dark text-white text-center py-3 mt-4">
    <!-- 黒背景、白文字、中央揃えのフッター領域 -->

        <small>&copy; 2026 掲示板アプリ</small>
        <!-- 著作権表示（スモールテキスト） -->

        <!-- 追記：お問い合わせのリンク -->
        <div class="footer_formLink">
             <a th:href="@{/contact}">お問い合わせ</a>
        </div>
    </footer>

    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- BootstrapのJavaScriptライブラリを読み込み -->

     <th:block layout:fragment="script"></th:block>

   </body>
</html>

<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
     <title layout:fragment="title">投稿詳細</title>
</head>

<div layout:fragment="content">

 <h1 th:text="${post.title}">タイトル</h1>

<div class="card mb-4">
 <div class="card-body">
  <!-- 改行を維持するために th:utext または白文字設定を使用 -->
  <p class="card-text" th:text="${post.content}" style="white-space: pre-wrap;">投稿内容</p>

   <!-- 追記：ユーザー名：テストケースの微調整 -->

  <small>投稿者：<span class="user_text" th:text="${post.user != null ? post.user.username : '不明'}">ユーザー名</span></small>

  <!-- 追記：いいねボタンの表示 -->

</div>
<!-- 追記：formタグの削除：<button> タグのみに変更。ボタンにはJSで検知するためのクラス like-btn と、対象の投稿IDを示す th:data-post-id を付与 -->
<button type="button" class="btn btn-sm like-btn"
              th:data-post-id="${post.id}"
              th:classappend="${isLiked != null and isLiked} ? 'btn-danger' : 'btn-outline-danger'">
          ♥ いいね <span class="like-count" th:text="${likeCount != null ? likeCount : 0}">0</span>
      </button>
</div>

 <div class="d-flex gap-2">
            <a th:href="@{/posts}" class="btn btn-secondary">一覧に戻る</a>
            <!-- 変更後：未ログイン（#authenticationがnull等）の考慮や安全性を高める -->
            <!-- 編集ボタン投稿者本人のみ表示 -->
           <a th:if="${post.user != null and #authentication.name == post.user.username}"
              th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary">編集</a>
           <!-- 削除ボタンを有効化 -->
           <form th:if="${post.user != null and (#authentication.name == post.user.username or #authorization.expression('hasRole(''ROLE_ADMIN'')'))}"
                 th:action="@{/posts/{id}/delete(id=${post.id})}"method="post" style="display: inline;">
            <button type="submit" class="btn btn-danger" onclick="return confirm('本当に削除しますか？')">削除</button>
           </form>
            </div>

    <!-- 👇 ここから追記：コメント一覧 -->
    <hr class="my-5">
    <h3>コメント一覧</h3>
    <div th:if="${#lists.isEmpty(comments)}">
        <p class="text-muted">コメントはまだありません。</p>
    </div>

    <div th:each="comment : ${comments}" class="card mb-3">
        <div class="card-body">
            <!-- コメント本文（改行維持） -->
            <p class="card-text" th:text="${comment.content}" style="white-space: pre-wrap;">コメント内容</p>
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">
                    投稿者: <span th:text="${comment.user != null ? comment.user.username : '不明'}">ユーザー名</span> |
                    投稿日時: <span th:text="${#temporals.format(comment.createdAt, 'yyyy/MM/dd HH:mm')}">2026/08/06</span>
                </small>

                <!-- 認可制御：自分のコメントのみ削除ボタンを表示 -->
                <form th:if="${comment.user != null and #authentication.name == comment.user.username or #authorization.expression('hasRole(''ROLE_ADMIN'')')}"
                      th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post" style="display: inline;">
                    <!-- 削除後に詳細画面に戻るための投稿ID -->
                    <input type="hidden" name="postId" th:value="${post.id}">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('コメントを削除しますか？')">削除</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 👇 ここから追記：コメント投稿フォーム -->
    <hr class="my-5">
    <h3>コメントを投稿する</h3>
    <form th:action="@{/comments/add}" method="post" class="mb-5">
        <!-- どの投稿へのコメントかを特定するための隠しフィールド -->
        <input type="hidden" name="postId" th:value="${post.id}">

        <div class="mb-3">
            <textarea name="content" class="form-control" rows="3" required placeholder="コメントを入力してください"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">コメントを投稿</button>
    </form>

   <th:block layout:fragment="script">
    <script  th:src="@{/js/like.js}"></script>
   </th:block>

</div>

</html>

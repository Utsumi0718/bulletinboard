<!DOCTYPE html>
<!-- HTML5のドキュメントタイプ宣言 -->

<html lang="ja" xmlns:th="http://www.thymeleaf.org"
                xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
                layout:decorate="~{layout/layout}">
<!-- layout:decorate="~{layout/layout}": ベースとなる共通レイアウト（templates/layout/layout.html）を適用宣言 -->

<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- CSRF対策のメタタグと非同期通信用のJavaScriptを追加 -->
  <title layout:fragment="title">投稿一覧</title>
  <!-- layout:fragment="title": 親レイアウトの title フラグメント領域に「投稿一覧」という文字列を注入 -->
</head>

<body>
  <div layout:fragment="content">
  <!-- layout:fragment="content": 親レイアウトの content フラグメント領域に以下のHTMLをまるごと挿入 -->

    <div class="d-flex justify-content-between align-items-center mb-4">
    <!-- タイトルとボタンを左右に分散配置するFlexboxレイアウト -->

            <h1>投稿一覧</h1>
            <!-- 画面見出し -->

            <!-- 新規投稿画面へのリンク -->
            <a th:href="@{/posts/new}" class="btn btn-primary">新規投稿</a>
            <!-- th:href="@{/posts/new}": 新規投稿画面（/posts/new）へのリンクURLを動的生成 -->


          <!-- 👇未ログインで弾かれて戻ってきた時だけ表示する -->
          <div th:if="${param.error != null and param.error[0] == 'unauthorized'}" style="color: red; margin-top: 5px; font-size: 0.9rem;">
           ※新規投稿するにはログインをしてください。
          </div>
        </div>

         <!-- 🔍 ここから追記：検索フォーム [7: 1245, 1246] -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <form th:action="@{/posts}" method="get">
          <div class="row g-2 align-items-center">
            <!-- キーワード入力欄 -->
            <div class="col-md-3">
              <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="検索キーワードを入力してください">
            </div>
            <!-- 一致条件の選択（セレクトボックス） [7: 1250, 1251] -->
            <div class="col-md-4">
              <select name="matchType" class="form-select">
                <option value="contains" th:selected="${matchType == 'contains'}">部分一致</option>
                <option value="starts" th:selected="${matchType == 'starts'}">前方一致</option>
                <option value="ends" th:selected="${matchType == 'ends'}">後方一致</option>
              </select>
            </div>
            <!-- 投稿の並び替えフォームを実装（昇順・降順） -->
             <div class="col-md-2">
               <select name="sortBy" class="form-select">
                <option value="createdAt" th:selected="${sortBy == 'createdAt' or sortBy == null }">投稿日時</option>
                <option value="title" th:selected="${sortBy == 'title'}">タイトル</option>
               </select>
             </div>
             <div class="col-md-3">
               <select name="sortOrder" class="form-select">
                <option value="desc" th:selected="${sortOrder == 'desc' or sortOrder == null }">降順（新しい順/Z-A）</option>
                <option value="asc" th:selected="${sortOrder == 'asc'}">昇順（古い順/A-Z）</option>
               </select>
             </div>
            <!-- 検索ボタン -->
            <div class="col-md-2">
              <button type="submit" class="btn btn-outline-primary w-100">
                検索
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <!-- 🔍 ここまで追記 -->

      <table class="table table-striped">
      <!-- ストライプ模様（交互に着色）のテーブルタグ -->

         <thead>
         <!-- テーブルのヘッダー行グループ -->

            <tr>

               <th>ユーザー名</th>

              <th>タイトル</th>
                <!-- 列見出し1: タイトル -->

                <th>投稿内容</th>
                <!-- 列見出し2: 作成日（※直下のtd構造との差異あり） -->

                <th>投稿日</th>
                <!-- 列見出し3: 操作 -->
                 <th>いいね</th>
                 <!-- 「いいね」ボタンを追加 -->
            </tr>
            </thead>

            <tbody>
            <!-- テーブルのボディ行グループ -->

              <!-- 投稿リストループ表示 -->
              <tr th:each="post :${posts}">
              <!-- th:each="post :${posts}": Controllerから渡された posts リストの要素数だけ <tr> を繰り返し生成 -->
                  <td th:text="${post.user.username}">
                      ユーザー名
                  </td>

                  <td>
                   <!-- list.html 内のタイトル表示箇所を修正 -->
                     <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">タイトル</a>
                     <!-- th:text="${post.title}": postオブジェクトの getTitle() の値をスパンタグ内に表示 -->
                  </td>

                  <td th:text="${post.content}">内容</td>
                  <!-- th:text="${post.content}": postオブジェクトの getContent() の値を表示 -->

                  <td th:text="${#temporals.format(post.createdAt, 'yyyy/MM/dd HH:mm')}">日時</td>
                  <!-- #temporals.format(...): LocalDateTime型の createdAt を「年/月/日 時:分」形式にフォーマット表示 -->
                  <td>
                    <button  type="button" class="btn btn-sm like-btn" th:data-post-id="${post.id}" th:classappend="${isLikedMap != null and isLikedMap[post.id]} ? 'btn-danger' : 'btn-outline-danger'">
                      ♥ <span class="like-count" th:text="${likeCounts != null and likeCounts[post.id] != null ? likeCounts[post.id] : 0}">0</span>
                    </button>
                  </td>
                  <!-- 追記「いいねボタンの表示」 -->
                  <!-- 追記：formタグの削除：<button> タグのみに変更。ボタンにはJSで検知するためのクラス like-btn と、対象の投稿IDを示す th:data-post-id を付与 -->

                </tr>
            </tbody>
    </table>

    <!-- ナビゲーション：ページネーションボタンを追加 -->
    <nav th:if="${postPage.totalPages > 1}" aria-lable="Page navgation" class="mt-4 mb-4">
      <ul class="pagenation justify-content-center">
       <li class="page-item" th:classappend="${postPage.first} ? 'disabled'">
          <a class="page-link"
             th:href="${postPage.first} ? '#' : @{/posts(page=${postPage.number - 1}, keyword=${keyword}, matchType=${matchType}, sortBy=${sortBy}, sortOrder=${sortOrder})}">
            前へ
          </a>
        </li>

        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, postPage.totalPages - 1)}"
            th:classappend="${i == postPage.number} ? 'active'">
          <a class="page-link"
             th:href="@{/posts(page=${i}, keyword=${keyword}, matchType=${matchType}, sortBy=${sortBy}, sortOrder=${sortOrder})}"
             th:text="${i + 1}">
            1
          </a>
        </li>

      <li class="page-item" th:classappend="${postPage.last} ? 'disabled'">
          <a class="page-link"
             th:href="@{/posts(page=${postPage.number + 1}, keyword=${keyword}, matchType=${matchType}, sortBy=${sortBy}, sortOrder=${sortOrder})}">
            次へ
          </a>
        </li>
      </ul>
    </nav>

    <!-- まだ投稿がない場合の表示 -->
     <div th:if="${#lists.isEmpty(posts)}" class="alert alert-info">
     <!-- th:if="${#lists.isEmpty(posts)}": postsリストが空（0件）の場合のみ、この div タグを表示する -->

        投稿がありません。最初の投稿をしてみましょう。
        <!-- メッセージテキスト -->
      </div>

      <!-- ログイン・ログアウトボタン -->

      <!-- 未ログイン状態での表示  -->
      <div sec:authorize="isAnonymous()">
          <a th:href="@{/login}">ログイン</a>
          <a th:href="@{/register}">新規登録</a>
      </div>

      <!-- ログイン状態での表示 -->
       <div sec:authorize="isAuthenticated()">
    <span>ログイン中: <strong sec:authentication="name">ユーザー名</strong> さん</span>

    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit">ログアウト</button>
    </form>
</div>

  </div>
   <script  th:src="@{/js/like.js}"></script>
</body>
</html>
